<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img">
<style>text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f} .t{font-size:23px;font-weight:700} .s{font-size:17px} .box{fill:#f7f6fb;stroke:#3b3a7a;stroke-width:3} .arr{stroke:#3b3a7a;stroke-width:4;fill:none;marker-end:url(#a)} .return{stroke:#8a4b2a;stroke-width:4;fill:none;stroke-dasharray:9 7;marker-end:url(#b)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3b3a7a"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a4b2a"/></marker></defs><rect class="box" x="55" y="55" rx="18" width="250" height="92"/><text class="t" x="180" y="92" text-anchor="middle">LEGISLACIÓN</text><text class="s" x="180" y="122" text-anchor="middle">obligatoria en su ámbito</text><rect class="box" x="375" y="55" rx="18" width="250" height="92"/><text class="t" x="500" y="92" text-anchor="middle">NORMA</text><text class="s" x="500" y="122" text-anchor="middle">reglas consensuadas</text><rect class="box" x="695" y="55" rx="18" width="250" height="92"/><text class="s" x="820" y="87" text-anchor="middle" font-weight="700">REQUISITO</text><text class="s" x="820" y="112" text-anchor="middle" font-weight="700">INTERNO</text><text class="s" x="820" y="137" text-anchor="middle">decisión propia</text><rect x="230" y="260" rx="18" width="250" height="100" fill="#ecebf5" stroke="#3b3a7a" stroke-width="3"/><text class="t" x="355" y="303" text-anchor="middle">CERTIFICACIÓN</text><text class="s" x="355" y="333" text-anchor="middle">evalúa conformidad</text><rect x="555" y="260" rx="18" width="250" height="100" fill="#f8eee8" stroke="#8a4b2a" stroke-width="3"/><text class="t" x="680" y="303" text-anchor="middle">ACREDITACIÓN</text><text class="s" x="680" y="333" text-anchor="middle">reconoce competencia</text><path class="arr" d="M500 147 V215 H355 V255"/><path class="arr" d="M680 260 V215 H570"/><text class="s" x="500" y="420" text-anchor="middle">Un certificado no sustituye el control técnico del producto</text></svg>