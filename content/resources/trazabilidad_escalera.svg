<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Escalera de trazabilidad" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>text{font-family:Verdana,'DejaVu Sans',Arial,sans-serif;fill:#25243f} .t{font-size:22px;font-weight:700} .s{font-size:15px} .b{font-size:18px;font-weight:700}</style><text class="t" x="500" y="38" text-anchor="middle">TRAZABILIDAD: CADA INSTRUMENTO SE COMPARA CON UNO MEJOR</text><rect x="30" y="70" rx="14" width="300" height="86" fill="#e6f1f2" stroke="#0e5a63" stroke-width="3"/><text class="b" x="180.0" y="106" text-anchor="middle">Patrón nacional</text><text class="s" x="180.0" y="132" text-anchor="middle">Centro Español de Metrología</text><rect x="250" y="145" rx="14" width="300" height="86" fill="#e6f1f2" stroke="#0e5a63" stroke-width="3"/><text class="b" x="400.0" y="181" text-anchor="middle">Laboratorio acreditado</text><text class="s" x="400.0" y="207" text-anchor="middle">por ENAC: calibra patrones</text><rect x="470" y="220" rx="14" width="300" height="86" fill="#e6f1f2" stroke="#0e5a63" stroke-width="3"/><text class="b" x="620.0" y="256" text-anchor="middle">Patrón del taller</text><text class="s" x="620.0" y="282" text-anchor="middle">bloque de 20,00 mm, con certificado</text><rect x="690" y="295" rx="14" width="300" height="86" fill="#e6f1f2" stroke="#0e5a63" stroke-width="3"/><text class="b" x="840.0" y="331" text-anchor="middle">Calibre del taller</text><text class="s" x="840.0" y="357" text-anchor="middle">se compara con el patrón</text><text class="s" x="30" y="190">↑ Arriba, el más exacto</text><text class="s" x="30" y="300" >Cada paso deja</text><text class="s" x="30" y="322">un certificado</text><text class="s" x="30" y="344">de calibración.</text></svg>